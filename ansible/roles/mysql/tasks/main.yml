---
# =============================================================================
# Role: mysql - MySQL Server installation and replication
# =============================================================================

- name: Install MySQL Server
  apt:
    name:
      - mysql-server
      - mysql-client
      - python3-mysqldb
    state: present

- name: Ensure MySQL is started and enabled
  systemd:
    name: mysql
    state: started
    enabled: yes

- name: Deploy MySQL configuration
  template:
    src: mysqld.cnf.j2
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    owner: root
    group: root
    mode: "0644"
  register: mysql_config_result

- name: Restart MySQL to apply configuration (including GTID)
  systemd:
    name: mysql
    state: restarted
  when: mysql_config_result.changed

- name: Ensure MySQL is running with correct config
  systemd:
    name: mysql
    state: started

- name: Set MySQL root password
  mysql_user:
    name: root
    host: localhost
    password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  ignore_errors: yes

- name: Create .my.cnf for root
  template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"

- name: Create application database
  mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_primary']

- name: Create application database user (local)
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "localhost"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_primary']

- name: Create application database user (from server 01)
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ server_01_ip }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_primary']

- name: Create application database user (from server 02)
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ server_02_ip }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_primary']

- name: Create replication user on primary
  mysql_user:
    name: "{{ mysql_replication_user }}"
    password: "{{ mysql_replication_password }}"
    host: "%"
    priv: "*.*:REPLICATION SLAVE,REPLICATION CLIENT"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_primary']

# --- Replication setup on secondary ---
- name: Get primary binary log file and position
  mysql_replication:
    mode: getprimary
    login_unix_socket: /var/run/mysqld/mysqld.sock
  register: primary_status
  when: inventory_hostname in groups['openuds_primary']
  delegate_to: "{{ groups['openuds_primary'][0] }}"

- name: Configure replication on secondary
  mysql_replication:
    mode: changeprimary
    primary_host: "{{ server_01_ip }}"
    primary_user: "{{ mysql_replication_user }}"
    primary_password: "{{ mysql_replication_password }}"
    primary_auto_position: yes
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_secondary']

- name: Start replication on secondary
  mysql_replication:
    mode: startreplica
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: inventory_hostname in groups['openuds_secondary']
  ignore_errors: yes
