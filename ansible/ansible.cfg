[defaults]
inventory = hosts.ini
roles_path = roles
host_key_checking = False
private_key_file = ../private_key
remote_user = root
timeout = 30
gathering = smart
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
