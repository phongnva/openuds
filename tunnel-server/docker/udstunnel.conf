# UDS Tunnel Server Configuration (Docker)

# Pid file
pidfile = /var/run/udstunnel.pid

# Do not drop privileges in Docker (runs as root or as container user)
# user =

# Log level: DEBUG, INFO, WARN, ERROR
loglevel = INFO

# Log file, leave empty for stdout (Docker best practice)
# logfile = /var/log/udstunnel.log

# Max log size before rotating (MB)
logsize = 20M

# Number of backup logs to keep
lognumber = 3

# Listen address
address = 0.0.0.0

# Listening port
port = 8443

# Force IPv6
ipv6 = false

# Number of workers (0 = auto-detect CPU cores)
workers = 0

# SSL configuration
ssl_certificate = /etc/openuds-tunnel/ssl/server.pem
ssl_certificate_key = /etc/openuds-tunnel/ssl/server.key
ssl_min_tls_version = 1.2
ssl_ciphers = ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384

# UDS Server connection
# Must point to tunnel ticket dispatcher URL
uds_server = https://serveruds.ovox.io/uds/rest/tunnel/ticket
uds_token = TUNNEL_TOKEN_PLACEHOLDER
uds_timeout = 10
uds_verify_ssl = false

# Command timeout (seconds)
command_timeout = 3

# Secret for admin commands (stats)
secret = MySecret

# Allowed IPs for admin commands
allow = 127.0.0.1

# Use uvloop for better performance
use_uvloop = true
