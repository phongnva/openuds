---
# =============================================================================
# OpenUDS HA - Full Deployment Playbook
# =============================================================================
# Usage:
#   ansible-playbook -i inventory/prod/hosts.yml playbooks/site.yml
#   ansible-playbook -i inventory/prod/hosts.yml playbooks/site.yml --check --diff
#
# Tag-based selective runs (examples):
#   --tags packages        Install all packages only
#   --tags database        Run all DB setup tasks
#   --tags galera          Galera cluster bootstrap/join/verify
#   --tags db_users        Create DB users only
#   --tags app             Deploy OpenUDS app code
#   --tags migrate         Run Django migrations + collectstatic
#   --tags config          Deploy all config templates
#   --tags ssl             Deploy SSL certificates only
#   --tags service         Start/enable all services
#   --tags nginx           Run all nginx tasks
#   --tags haproxy         Run all HAProxy tasks
#   --tags keepalived      Run all Keepalived tasks
#   --tags verify          Run Galera cluster verification
# =============================================================================

- name: Deploy OpenUDS HA
  hosts: uds_servers
  become: yes

  roles:
    - common
    - mysql
    - mariadb_galera
    - openuds
    - nginx
    - haproxy
    - keepalived

  post_tasks:
    - name: Verify all services are running
      systemd:
        name: "{{ item }}"
        state: started
      loop:
        - mariadb
        - openuds-server
        - nginx
        - haproxy
        - keepalived
      tags:
        - service
        - verify

    - name: Display deployment info
      debug:
        msg: |
          ========================================
          OpenUDS HA Deployment Complete!
          ========================================
          Node: {{ inventory_hostname }} ({{ ansible_host }})
          Role: {{ keepalived_state }}
          Keepalived: {{ keepalived_state }}
          VIP: {{ keepalived_vip }}
          Domain: {{ domain }}
          ========================================
      tags:
        - always
