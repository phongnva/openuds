---
- name: Install MariaDB and Galera packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - mariadb-server
      - mariadb-client
      - mariadb-backup
      - galera-4
      - rsync
      - socat
      - python3-pymysql
    state: present
  tags:
    - mysql
    - database
    - packages

- name: Deploy Galera MariaDB configuration
  ansible.builtin.template:
    src: 99-galera.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-galera.cnf
    owner: root
    group: root
    mode: "0644"
  tags:
    - mysql
    - database
    - config

- name: Create root MariaDB client defaults file
  ansible.builtin.copy:
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"
    content: |
      [client]
      user=root
      socket=/run/mysqld/mysqld.sock
  tags:
    - mysql
    - database
    - security
    - config

- name: Stop MariaDB until Galera bootstrap phase
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: stopped
  tags:
    - mysql
    - database
    - service
