---
- name: Install MariaDB and Galera packages
  apt:
    name:
      - mariadb-server
      - mariadb-client
      - mariadb-backup
      - galera-4
      - python3-mysqldb
      - python3-pymysql
    state: present

# Do NOT start MariaDB here. The Galera config is not yet deployed,
# and starting with wsrep_on=ON + gcomm://nodes will fail if no cluster
# exists. The mariadb_galera role handles the correct startup sequence.
