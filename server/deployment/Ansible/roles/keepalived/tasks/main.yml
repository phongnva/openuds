---
- name: Install Keepalived
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: keepalived
    state: present
  tags:
    - keepalived
    - packages

- name: Deploy HAProxy health check script
  ansible.builtin.template:
    src: check_haproxy.sh.j2
    dest: /usr/local/bin/check_haproxy.sh
    owner: root
    group: root
    mode: "0755"
  notify: restart keepalived
  tags:
    - keepalived
    - haproxy
    - config

- name: Deploy Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart keepalived
  tags:
    - keepalived
    - config

- name: Ensure Keepalived is enabled and started
  ansible.builtin.service:
    name: keepalived
    enabled: true
    state: started
  tags:
    - keepalived
    - service
