---
- name: Set host timezone
  ansible.builtin.timezone:
    name: "{{ common_timezone }}"
  tags:
    - common
    - system

- name: Install shared operating system packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - git
      - rsync
      - unzip
      - build-essential
      - python3
      - python3-dev
      - python3-pip
      - python3-pymysql
      - python3-venv
      - pkg-config
      - libxml2-dev
      - libxslt1-dev
      - libffi-dev
      - libldap2-dev
      - libsasl2-dev
      - libssl-dev
      - default-libmysqlclient-dev
      - libmemcached-dev
      - libjpeg-dev
      - zlib1g-dev
      - libpango-1.0-0
      - libpangoft2-1.0-0
      - libharfbuzz-subset0
      - shared-mime-info
      - socat
    state: present
  tags:
    - common
    - packages

- name: Check for existing swap file
  ansible.builtin.stat:
    path: /swapfile
  register: common_swapfile
  tags:
    - common
    - system

- name: Create swap file when the host has no swap
  ansible.builtin.command:
    cmd: "fallocate -l {{ common_swap_size_mb }}M /swapfile"
  when:
    - common_swap_size_mb | int > 0
    - ansible_swaptotal_mb | int == 0
    - not common_swapfile.stat.exists
  tags:
    - common
    - system

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    state: file
    owner: root
    group: root
    mode: "0600"
  when:
    - common_swap_size_mb | int > 0
    - common_swapfile.stat.exists or ansible_swaptotal_mb | int == 0
  tags:
    - common
    - system

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when:
    - common_swap_size_mb | int > 0
    - ansible_swaptotal_mb | int == 0
    - not common_swapfile.stat.exists
  tags:
    - common
    - system

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s+'
    line: "/swapfile none swap sw 0 0"
    state: present
  when: common_swap_size_mb | int > 0
  tags:
    - common
    - system

- name: Enable swap immediately
  ansible.builtin.command:
    cmd: swapon /swapfile
  when:
    - common_swap_size_mb | int > 0
    - ansible_swaptotal_mb | int == 0
  changed_when: true
  tags:
    - common
    - system

